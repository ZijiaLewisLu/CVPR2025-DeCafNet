model:
  # name: iter

  text_net:
    name: identity        # identity | transformer
    in_dim: 512           # input dimension
    embd_dim: 768         # embedding dimension
    n_heads: 4            # number of attention heads
    max_seq_len: 24       # max number of tokens in text query
    use_abs_pe: false     # whether to use absolute position encoding
    use_bkgd_token: true  # whether to add background token
    
  vid_net:
    name: transformer
    in_dim: 256           # input dimension
    embd_dim: 384         # embedding dimension
    n_heads: 4            # number of attention heads
    max_seq_len: 2304     # max number of clips in video
    arch: [2, 0, 8]       # backbone architecture (embed | stem | branch)
    mha_win_size: 19      # window size for local self-attention
    attn_pdrop: 0.0       # dropout rate for attention map
    proj_pdrop: 0.1       # dropout rate for projection
    path_pdrop: 0.1       # dropout rate for residual paths
    use_abs_pe: true      # whether to use absolute position encoding
    cdrop: 0.25
    
  fusion:
    name: xattn
    n_layers: 2           # number of fusion layers
    n_heads: 4            # number of attention heads
    attn_pdrop: 0.0       # dropout rate for attention map
    proj_pdrop: 0.1       # dropout rate for projection
    path_pdrop: 0.1       # dropout rate for residual path
    xattn_mode: adaln     # cross-attention mode
    
  cls_head:
    name: cls
    n_layers: 2           # number of conv layers (output layer excluded)
    prior_prob: 0.0       # prior probability for positive class

  reg_head:
    name: reg
    n_layers: 2           # number of conv layers (output layer excluded)

  msf: True
  scat: True
  sn: 30
  sratio: 0.5
  norm: true

pt_gen:
  regression_range: 4     # normalized regression range
  sigma: 0.5              # controls overlap of regression ranges (1 for no overlap)

data:
  anno_file: /tmp/decafnet/data/datasets/egovlpv1/features/v1/nlq_32x8_d2.json
  clip_size: 32
  clip_stride: 8
  clip_token_fname: /tmp/decafnet/data/datasets/clip/nlq_token_features_B_32.npy
  crop_ratio: null
  downsample_rate: 2
  eval_split: val
  ext_score_dir: null
  max_num_text: 2
  name: ego4d
  sidekick_ds: 1
  sidekick_vid_feat_dir: &id001
  - /tmp/decafnet/data/log/end2end/NLQ_sidekick_newFeat_Encoder[tp_loc:0]/1/features/10-15000
  sidekick_vid_load: pk_avg
  split: train
  text_cls_fname: /tmp/decafnet/data/datasets/egovlpv1/features/v1/text_cls/sentence_256_{split}.npy
  text_feat_dir: /tmp/decafnet/data/datasets/egovlpv1/features/v1/text/text_768d/
  to_fixed_len: false
  trunc_thresh: 0.5
  vid_feat_dir: &id002
  - /tmp/decafnet/data/datasets/egovlpv1/features/v1/video/32x8_d2
  vid_load: npy

train:

  batch_size: 1
  num_workers: 0

  epochs: 9
  warmup_epochs: 5
  ema_beta: 0.999

  center_sampling: radius
  center_sampling_radius: 1.5

  loss_norm: 10
  loss_weight: 1.0
  reg_loss: iou             # iou | diou


optimizer:
  name: adamw
  lr: 1.e-4
  weight_decay: 0.05
  clip_grad_norm: 1.0

scheduler:
  name: multistep       # cosine | multistep
  steps: [-1]
    
eval:
  data:
    name: ego4d

  ranks: [1, 5]
  iou_threshs: [0.3, 0.5]

  pre_nms_topk: 2000
  pre_nms_thresh: 0.001
  seg_len_thresh: 0.1

nms:
  mode: soft_nms
  iou_thresh: 0.1
  min_score: 0.001
  max_num_segs: 5
  sigma: 0.9
  voting_thresh: 0.95

seed: 1234567891

aux:
  log_interval: 5
  log: 'downstream'
  # dryrun: true
  wandb_project: "downstream"
  eval_by: 'itr'
  eval_run: 2000
